<!doctype html>
<html lang="en" data-theme="light">
<head>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/console.css?v=17">
</head>
<body>
  <header class="appnav">
    <div class="appnav-inner">

        </span>
        <span class="brand-name">AutoGuard<span>AI</span></span>
        <span class="brand-tag">self-healing ANPR</span>
      </a>

      <nav class="mainnav" aria-label="Main navigation">
        <a href="#/scan" data-route="scan">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10M9 9.5h6M9 14.5h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>Scan desk</span>
        </a>
        <a href="#/review" data-route="review">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4.5 7.5A8 8 0 1 1 4 14M4 7.5V4m0 3.5H7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 8.5V12l2.5 1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>Review</span>
          <span class="nav-count" id="review-count" hidden></span>
        </a>
        <a href="#/archive" data-route="archive">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 7.5h16M6 7.5V20h12V7.5M9 4h6l1.5 3.5h-9L9 4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9.5 11.5h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>Archive</span>
        </a>
        <a href="#/intel" data-route="intel">

        </a>

      <div class="appnav-right">
        <span class="nav-status" title="Pipeline status">
          <span class="pulse" id="system-dot"></span>
          <span id="system-label">checking</span>
        </span>
        <button class="nav-toggle" id="demo-toggle" type="button"><span id="demo-toggle-label">Demo: off</span></button>
        <button class="nav-toggle" id="export-csv" type="button">Export ledger</button>
        <button class="nav-icon" id="theme-toggle" type="button" title="Switch light / dark" aria-label="Switch theme"></button>
        <button class="nav-cta" id="new-scan" type="button">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
          New scan
        </button>
      </div>
    </div>
  </header>

  <div class="pagehead">
    <div class="pagehead-copy">
      <p class="eyebrow" id="page-eyebrow">AUTOGUARD / SCAN DESK</p>
      <div class="pagehead-title">
        <h1 id="page-title">Scan desk</h1>
      </div>
    </div>
    <div class="pagehead-actions">
      <button class="head-action" id="palette-open" type="button" title="Open command palette (Ctrl/Cmd + K)">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span>Jump to…</span><kbd>⌘K</kbd>
      </button>
      <span class="clock" id="clock"></span>
    </div>
  </div>

  <main class="view" id="view" aria-live="polite"></main>

  <div id="modal-root"></div>
  <div id="drawer-root"></div>
  <div id="palette-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script src="/static/app.js?v=console20"></script>
</body>
</html>
