<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoGuard label verifier</title>
<style>
  :root { --mint:#0f766e; --mint-soft:#e7f6f3; --line:#dbe3ec; --ink:#0f1b2a; --muted:#5b6b7c; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui, "Segoe UI", sans-serif; color:var(--ink); background:#f5f8fb; }
  header { position:sticky; top:0; z-index:2; display:flex; flex-wrap:wrap; gap:10px; align-items:center;
           padding:12px 18px; background:#fff; border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0 auto 0 0; letter-spacing:-.01em; }
  header h1 span { color:var(--muted); font-weight:400; }
  .btn { border:1px solid var(--line); background:#fff; border-radius:8px; padding:7px 12px; font:inherit; cursor:pointer; }
  .btn.primary { background:var(--mint); border-color:var(--mint); color:#fff; font-weight:600; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  input[type=file] { display:none; }
  label.file-btn { display:inline-flex; align-items:center; }
  main { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(320px,1fr); gap:18px; padding:18px; max-width:1400px; margin:0 auto; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:12px; }
  .stage { min-height:420px; display:flex; flex-direction:column; }
  .stage-head { display:flex; gap:10px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); font-size:12px; color:var(--muted); }
  .stage-head b { color:var(--ink); }
  .image-wrap { flex:1; display:grid; place-items:center; padding:14px; min-height:340px; }
  .image-wrap img { max-width:100%; max-height:62vh; border-radius:8px; border:1px solid var(--line); background:#0b1622; }
  .empty { color:var(--muted); font-size:13px; text-align:center; padding:40px 20px; }
  .side { padding:16px; display:flex; flex-direction:column; gap:14px; }
  .label-edit { font-size:24px; letter-spacing:.14em; font-family:ui-monospace, "Cascadia Mono", monospace; width:100%;
                padding:12px 14px; border:1.5px solid var(--line); border-radius:10px; text-transform:uppercase; }
  .label-edit:focus { outline:none; border-color:var(--mint); box-shadow:0 0 0 3px rgba(15,118,110,.12); }
  .meta { display:grid; gap:4px; font-size:12px; color:var(--muted); word-break:break-all; }
  .verify { display:flex; gap:9px; align-items:center; padding:10px 12px; border:1px solid var(--line); border-radius:9px; background:#fbfdfe; cursor:pointer; }
  .verify input { width:17px; height:17px; accent-color:var(--mint); }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .progress { height:6px; border-radius:99px; background:#e8eef5; overflow:hidden; }
  .progress span { display:block; height:100%; background:linear-gradient(90deg,var(--mint),#14b8a6); }
  .hint { font-size:12px; color:var(--muted); }
  kbd { font-family:ui-monospace, monospace; font-size:11px; border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:1px 5px; background:#fff; }
  .status { font-size:12px; color:var(--mint); min-height:18px; }
  @media (max-width:900px) { main { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>AutoGuard label verifier <span id="file-name">— load a labels CSV</span></h1>
  <label class="file-btn btn"><input id="csv-input" type="file" accept=".csv,text/csv">Load labels CSV</label>
  <label class="file-btn btn"><input id="images-input" type="file" multiple accept="image/*" webkitdirectory>Load crop image folder</label>
  <button class="btn" id="download" disabled>Export CSV</button>
</header>
<main>
  <section class="panel stage">
    <div class="stage-head"><b id="row-label">No row</b><span id="row-meta"></span></div>
    <div class="image-wrap" id="image-wrap"><div class="empty">Load a labels CSV (data/cold_test/labels.csv), then pick the folder that contains the crop images.</div></div>
  </section>
  <aside class="panel side">
    <div class="progress"><span id="progress" style="width:0%"></span></div>
    <div class="hint" id="progress-text">0 verified</div>
    <label for="label-input" class="hint">Plate text</label>
    <input id="label-input" class="label-edit" autocomplete="off" spellcheck="false" maxlength="16" placeholder="PLATE TEXT" disabled>
    <label class="verify"><input id="verified" type="checkbox" disabled> I checked this crop against the text</label>
    <div class="row">
      <button class="btn" id="prev">Previous</button>
      <button class="btn primary" id="next" disabled>Save &amp; next</button>
      <button class="btn" id="skip">Next unverified</button>
    </div>
    <div class="meta">
      <span id="meta-source"></span>
      <span id="meta-crop"></span>
    </div>
    <div class="status" id="status"></div>
    <p class="hint"><kbd>Enter</kbd> save and go next · <kbd>Shift</kbd>+<kbd>Enter</kbd> go back. Edits are kept in this browser until you export.</p>
  </aside>
</main>
<script>
const state = { rows: [], index: 0, images: new Map(), storageKey: null };
const $ = (id) => document.getElementById(id);

function parseCsv(text) {
  const rows = [];
  let field = '', row = [], quoted = false;
  for (let i = 0; i < text.length; i += 1) {
    const char = text[i];
    if (quoted) {
      if (char === '"' && text[i + 1] === '"') { field += '"'; i += 1; }
      else if (char === '"') quoted = false;
      else field += char;
    } else if (char === '"') quoted = true;
    else if (char === ',') { row.push(field); field = ''; }
    else if (char === '\n' || char === '\r') {
      if (char === '\r' && text[i + 1] === '\n') i += 1;
      row.push(field); field = '';
      if (row.some((value) => value !== '')) rows.push(row);
      row = [];
    } else field += char;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  const header = rows.shift().map((name) => name.trim());
  return rows.map((values) => Object.fromEntries(header.map((name, i) => [name, values[i] ?? ''])));
}

function csvEscape(value) { return /[",\n]/.test(value) ? '"' + value.replace(/"/g, '""') + '"' : value; }

function load() {
  const row = state.rows[state.index];
  if (!row) return;
  $('row-label').textContent = `Row ${state.index + 1} of ${state.rows.length}`;
  $('row-meta').textContent = row.verified === '1' ? 'verified' : 'not verified';
  $('label-input').value = row.plate_text;
  $('verified').checked = row.verified === '1';
  $('label-input').disabled = false;
  $('verified').disabled = false;
  $('next').disabled = false;
  $('meta-source').textContent = 'Source: ' + (row.source_image || '—');
  $('meta-crop').textContent = 'Crop: ' + (row.crop_path || '—');
  const base = (row.crop_path || '').split('/').pop().toLowerCase();
  const image = state.images.get(base);
  $('image-wrap').innerHTML = image
    ? `<img alt="crop" src="${image}">`
    : `<div class="empty">No image loaded for <b>${base || 'this row'}</b>.<br>Load the folder that contains the crop images.</div>`;
  updateProgress();
}

function save() {
  const row = state.rows[state.index];
  if (!row) return;
  row.plate_text = $('label-input').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
  row.verified = $('verified').checked ? '1' : '0';
  persist();
  $('status').textContent = 'Saved row ' + (state.index + 1);
}

function persist() {
  if (!state.storageKey) return;
  localStorage.setItem(state.storageKey, JSON.stringify(state.rows.map((row) => ({ plate_text: row.plate_text, verified: row.verified }))));
}

function restore(key) {
  const raw = localStorage.getItem(key);
  if (!raw) return false;
  try {
    const saved = JSON.parse(raw);
    if (saved.length !== state.rows.length) return false;
    state.rows.forEach((row, index) => Object.assign(row, saved[index]));
    return true;
  } catch { return false; }
}

function updateProgress() {
  const done = state.rows.filter((row) => row.verified === '1').length;
  const pct = state.rows.length ? Math.round((done / state.rows.length) * 100) : 0;
  $('progress').style.width = pct + '%';
  $('progress-text').textContent = `${done} of ${state.rows.length} verified (${pct}%)`;
}

function step(delta) {
  save();
  state.index = Math.min(state.rows.length - 1, Math.max(0, state.index + delta));
  $('status').textContent = '';
  load();
}

function nextUnverified() {
  save();
  for (let offset = 1; offset <= state.rows.length; offset += 1) {
    const index = (state.index + offset) % state.rows.length;
    if (state.rows[index].verified !== '1') { state.index = index; load(); return; }
  }
  $('status').textContent = 'Every row is verified.';
}

$('csv-input').addEventListener('change', async (event) => {
  const file = event.target.files[0];
  if (!file) return;
  state.rows = parseCsv(await file.text());
  state.index = 0;
  state.storageKey = 'autoguard_labels_' + file.name + '_' + file.size;
  restore(state.storageKey);
  $('file-name').textContent = file.name;
  $('download').disabled = false;
  load();
});

$('images-input').addEventListener('change', (event) => {
  state.images.clear();
  for (const file of event.target.files) {
    state.images.set(file.name.toLowerCase(), URL.createObjectURL(file));
  }
  load();
});

$('verified').addEventListener('change', save);
$('label-input').addEventListener('input', () => { if (state.rows[state.index]) state.rows[state.index].plate_text = $('label-input').value; });
$('prev').addEventListener('click', () => step(-1));
$('next').addEventListener('click', () => step(1));
$('skip').addEventListener('click', nextUnverified);
$('label-input').addEventListener('keydown', (event) => {
  if (event.key !== 'Enter') return;
  event.preventDefault();
  if (!$('verified').checked) $('verified').checked = true;
  step(event.shiftKey ? -1 : 1);
});

$('download').addEventListener('click', () => {
  save();
  const header = ['source_image', 'crop_path', 'plate_text', 'verified'];
  const lines = [header.join(',')].concat(state.rows.map((row) => header.map((name) => csvEscape(row[name] ?? '')).join(',')));
  const blob = new Blob([lines.join('\n') + '\n'], { type: 'text/csv' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'labels.csv';
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 2000);
});
</script>
</body>
</html>
